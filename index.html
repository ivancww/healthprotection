<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Health Protection Planner v1.2.6</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#1e3a8a">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HealthPlan">
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-light: #eff6ff;
      --accent: #d97706;
      --accent-light: #fffbeb;
      --danger: #dc2626;
      --danger-light: #fef2f2;
      --warning-bg: #fef3c7;
      --warning-border: #fcd34d;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --border: #cbd5e1;
      --pink-border: #f8d7da;
      --radius: 16px;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang HK", "Microsoft JhengHei", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px;
    }
    .container {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text-sub);
    }
    .version-tag {
      font-size: 11px;
      background: #e2e8f0;
      color: #475569;
      padding: 2px 7px;
      border-radius: 10px;
      font-weight: 800;
      margin-left: 6px;
      cursor: pointer;
    }
    .role-badge {
      font-size: 11.5px;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 12px;
      background: #e0e7ff;
      color: #3730a3;
    }
    .progress-track {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    .progress-step {
      height: 6px;
      flex: 1;
      background: var(--border);
      border-radius: 999px;
      transition: background 0.3s ease;
    }
    .progress-step.active {
      background: var(--primary);
    }
    .card {
      display: none;
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 28px 24px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
    }
    .card.active {
      display: block;
      animation: fadeIn 0.25s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .tag {
      display: inline-block;
      font-size: 12px;
      font-weight: 800;
      color: var(--primary);
      background: var(--primary-light);
      padding: 4px 10px;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.4;
      margin-bottom: 8px;
      color: var(--text-main);
    }
    p.subtitle {
      font-size: 14px;
      color: var(--text-sub);
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .role-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 14px;
    }
    .role-card {
      border: 2px dashed var(--pink-border);
      border-radius: 14px;
      padding: 20px 14px;
      background: #ffffff;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .role-card:hover {
      border-color: var(--primary);
      background: var(--primary-light);
    }
    .role-card.selected {
      border-color: var(--primary);
      border-style: solid;
      background: var(--primary-light);
      box-shadow: 0 0 0 1.5px var(--primary);
    }
    .role-emoji { font-size: 38px; margin-bottom: 8px; }
    .role-title { font-size: 17px; font-weight: 800; color: var(--text-main); margin-bottom: 4px; }
    .role-subtitle { font-size: 13px; font-weight: 700; color: var(--primary); margin-bottom: 6px; }
    .role-desc { font-size: 11.5px; color: var(--text-sub); line-height: 1.4; }
    .dual-frontline-highlight {
      background: var(--danger-light);
      border: 1.5px solid #fecaca;
      border-left: 4px solid var(--danger);
      padding: 12px 14px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 13.5px;
      color: var(--danger);
      line-height: 1.5;
      font-weight: 600;
    }
    .option-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .choice-btn {
      display: flex;
      flex-direction: column;
      gap: 4px;
      text-align: left;
      width: 100%;
      padding: 16px 18px;
      background: var(--card-bg);
      border: 2px dashed var(--pink-border);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .choice-btn * { pointer-events: none; }
    .choice-btn:hover { border-color: var(--primary); background: var(--primary-light); }
    .choice-btn.selected {
      background: var(--primary-light);
      border-color: var(--primary);
      border-style: solid;
      box-shadow: 0 0 0 1px var(--primary);
    }
    .choice-btn .title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
    }
    .choice-btn .desc {
      font-size: 13px;
      color: var(--text-sub);
      line-height: 1.4;
    }
    .section-block {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      margin-top: 16px;
    }
    .section-block h2 {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 14px;
    }
    .defense-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-top: 12px;
    }
    .defense-card h3 {
      font-size: 14px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 10px;
    }
    .input-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 8px;
    }
    label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
    }
    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 2px dashed var(--pink-border);
      background: #ffffff;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      outline: none;
    }
    textarea {
      resize: vertical;
      min-height: 60px;
    }
    .stat-display {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }
    .stat-box {
      background: #ffffff;
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 10px;
    }
    .stat-label {
      font-size: 11px;
      color: var(--text-sub);
    }
    .stat-value {
      font-size: 17px;
      font-weight: 800;
      margin-top: 4px;
      color: var(--text-main);
    }
    .stat-value.highlight { color: var(--danger); }
    .grid-2x2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 12px;
    }
    .grid-btn {
      padding: 18px;
      text-align: center;
      border-radius: 12px;
      border: 2px dashed var(--pink-border);
      background: var(--card-bg);
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      line-height: 1.5;
      transition: all 0.2s ease;
    }
    .grid-btn * { pointer-events: none; }
    .grid-btn.selected {
      background: var(--primary-light);
      border-color: var(--primary);
      border-style: solid;
      box-shadow: 0 0 0 1px var(--primary);
    }
    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }
    .btn {
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }
    .btn-primary {
      background: #0f172a;
      color: #ffffff;
      flex: 1;
    }
    .btn-secondary {
      background: #f1f5f9;
      border: 1px solid var(--border);
      color: var(--text-main);
    }
    .solution-group {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 16px;
    }
    .solution-btn {
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      text-align: left;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      transition: transform 0.1s ease;
    }
    .solution-btn:active {
      transform: scale(0.98);
    }
    .solution-btn img {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
    }
    .solution-btn-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .solution-btn-text .app-name {
      font-size: 15px;
      font-weight: 800;
    }
    .solution-btn-text .app-action {
      font-size: 12px;
      font-weight: 600;
      opacity: 0.8;
    }
    .solution-btn.med, .solution-btn.ci {
      background: #eff6ff;
      border-color: #bfdbfe;
      color: #1e40af;
    }
    .thought-card {
      background: var(--warning-bg);
      border: 1.5px solid var(--warning-border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      font-size: 14px;
      line-height: 1.6;
      color: #78350f;
    }
    .frontline-card-green {
      background: #f0fdf4;
      border: 1.5px solid #bbf7d0;
      border-left: 4px solid #16a34a;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      font-size: 13.5px;
      line-height: 1.6;
      color: #15803d;
      font-weight: 600;
    }
    .conflict-alert {
      background: #ffffff;
      border: 1.5px dashed var(--danger);
      border-radius: 8px;
      padding: 10px 12px;
      margin-top: 10px;
      font-size: 13px;
      font-weight: 700;
      color: var(--danger);
      line-height: 1.5;
    }
    .sync-status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      margin-right: 6px;
    }
    /* 管理員後台 Modal */
    #adminModal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.7);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .admin-card {
      background: #ffffff;
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .admin-header {
      padding: 16px 20px;
      background: #0f172a;
      color: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .admin-body {
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .admin-section-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--primary);
      border-bottom: 2px solid var(--primary-light);
      padding-bottom: 4px;
      margin-top: 8px;
    }
    .admin-item {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .admin-footer {
      padding: 14px 20px;
      background: #f1f5f9;
      display: flex;
      gap: 10px;
      border-top: 1px solid #e2e8f0;
    }
    @media (max-width: 520px) {
      .input-grid, .stat-display, .grid-2x2, .solution-group, .role-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header-bar">
    <div style="display:flex; align-items:center;">
      <span class="sync-status-dot" id="syncDot" title="Google Sheet 同步中"></span>
      <span>HEALTH PROTECTION PLANNER</span>
      <span class="version-tag" id="appVersion" title="點擊開啟後台">v1.2.6</span>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <span class="role-badge" id="topRoleBadge">👨‍👩‍👧 成人模式</span>
      <button type="button" id="btnOpenAdmin" style="background:none; border:none; font-size:16px; cursor:pointer;" title="後台管理">⚙️</button>
      <span id="pageCounter">00 / 05</span>
    </div>
  </div>
  
  <div class="progress-track" id="mainProgressTrack"></div>
  <main id="dynamicAppContainer"></main>
</div>

<!-- 後台管理彈窗 (免密碼直接開啟) -->
<div id="adminModal">
  <div class="admin-card">
    <div class="admin-header">
      <span style="font-weight:800; font-size:16px;">🛠️ 後台管理系統 (Google Sheet 雙向同步)</span>
      <button type="button" id="btnCloseAdmin" style="background:none; border:none; color:#fff; font-size:20px; cursor:pointer;">✕</button>
    </div>
    <div class="admin-body" id="adminBodyContent"></div>
    <div class="admin-footer">
      <button type="button" class="btn btn-secondary" id="btnCancelAdmin" style="flex:1;">取消</button>
      <button type="button" class="btn btn-primary" id="btnSaveAdmin" style="flex:2;">💾 儲存並同步至 Google Sheet</button>
    </div>
  </div>
</div>

<script>
  (function() {
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwiLwLfOhe_R0rwDpkhSPJz_qBdOchyEozTIg7biPfJxkZudjdUgPKjeQEGYSnuiTHG/exec";
    var state = {
      targetRole: 'adult',
      currentStep: 0,
      totalSteps: 5,
      rolePages: [],
      step1Focus: null,
      step1RawText: '',
      step2Scenario: null,
      step2RawText: '',
      losses: [],
      alertMsg: '',
      showAppMode: 'med',
      medCost: 200000,
      companyLimit: 100000,
      companyRate: 80,
      companyPay: 0,
      personalLimit: 100000,
      personalRate: 80,
      personalPay: 80000,
      finalMedGap: 20000,
      ciTotal: 1440000,
      ciExisting: 500000,
      ciNetGap: 940000,
      hasCompanyMed: 'no',
      hasPersonalMed: 'yes',
      ciMonthly: 40000,
      ciMonths: 36
    };
    var db = null;
    function parseNum(val) {
      if (typeof val === 'number') return val;
      return Number(String(val || '').replace(/,/g, '')) || 0;
    }
    function cleanKey(val) {
      if (!val) return '';
      val = String(val).toLowerCase().trim();
      if (val.startsWith('med')) return 'medical';
      if (val.startsWith('ci')) return 'ci';
      if (val.startsWith('both')) return 'both';
      if (val.startsWith('any')) return 'any';
      return val;
    }
    function initFormatCurrency() {
      document.querySelectorAll('.format-currency').forEach(function(input) {
        input.addEventListener('input', function() {
          var rawVal = this.value.replace(/,/g, '').replace(/[^\d]/g, '');
          if (rawVal === '') { this.value = ''; return; }
          this.value = Number(rawVal).toLocaleString();
        });
        input.addEventListener('blur', function() {
          if (this.value === '') this.value = '0';
        });
      });
    }
    function renderApp() {
      if (!db || !db.pages) return;
      var container = document.getElementById('dynamicAppContainer');
      container.innerHTML = '';
      state.rolePages = db.pages.filter(p => p.role === state.targetRole).sort((a,b) => a.stepOrder - b.stepOrder);
      state.totalSteps = state.rolePages.length;
      var track = document.getElementById('mainProgressTrack');
      track.innerHTML = '';
      for (var s = 0; s <= state.totalSteps; s++) {
        var stepDiv = document.createElement('div');
        stepDiv.className = 'progress-step' + (s <= state.currentStep ? ' active' : '');
        stepDiv.id = 'pstep_' + s;
        track.appendChild(stepDiv);
      }
      // STEP 0
      var p0Html = `
        <section class="card ${state.currentStep === 0 ? 'active' : ''}" id="stepCard_0">
          <span class="tag">健康守護 ｜ 入口</span>
          <h1>今日，我哋想守護邊一位？</h1>
          <p class="subtitle">選擇本次規劃對象，系統將自動調整專屬問題情境與防線分析：</p>
          <div class="role-grid">
            <div class="role-card ${state.targetRole === 'adult' ? 'selected' : ''}" data-role-btn="adult">
              <div class="role-emoji">👨‍👩‍👧</div>
              <div class="role-title">成人</div>
              <div class="role-subtitle">守護自己</div>
              <div class="role-desc">工作／收入／家庭責任<br>維持生活水準與家庭資產防線</div>
            </div>
            <div class="role-card ${state.targetRole === 'child' ? 'selected' : ''}" data-role-btn="child">
              <div class="role-emoji">👶</div>
              <div class="role-title">小朋友</div>
              <div class="role-subtitle">守護孩子</div>
              <div class="role-desc">健康／成長／教育規劃<br>確保黃金治療與父母停工照護基金</div>
            </div>
          </div>
          <div class="btn-group">
            <button type="button" class="btn btn-primary" data-nav-action="next">開始健康防線探索 →</button>
          </div>
        </section>`;
      container.insertAdjacentHTML('beforeend', p0Html);
      // STEP 1 - 5
      state.rolePages.forEach(function(page, idx) {
        var stepNum = idx + 1;
        var opts = db.options.filter(o => o.pageId === page.pageId).sort((a,b) => a.order - b.order);
        var pageHtml = '';
        if (page.pageType === '單選題') {
          var optButtons = '';
          opts.forEach(function(o) {
            optButtons += `
              <button type="button" class="choice-btn" data-step-choice="${stepNum}" data-opt-key="${o.optionKey}" data-title-text="${o.title}">
                <span class="title">${o.icon ? o.icon + ' ' : ''}${o.title}</span>
                <span class="desc">${o.desc || ''}</span>
              </button>`;
          });
          pageHtml = `
            <section class="card ${state.currentStep === stepNum ? 'active' : ''}" id="stepCard_${stepNum}">
              <span class="tag">${page.tagName}</span>
              <h1>${page.title}</h1>
              ${page.subtitle.includes('🚨') ? `<div class="dual-frontline-highlight">${page.subtitle}</div>` : `<p class="subtitle">${page.subtitle}</p>`}
              <div class="option-list">${optButtons}</div>
              <div class="btn-group">
                <button type="button" class="btn btn-secondary" data-nav-action="prev">← 返回</button>
                <button type="button" class="btn btn-primary" data-nav-action="next">下一步 →</button>
              </div>
            </section>`;
        } else if (page.pageType === '試算頁') {
          var isChild = state.targetRole === 'child';
          var defaultMed = isChild ? (db.config["兒童預設醫療費"] || 200000) : (db.config["成人預設醫療費"] || 200000);
          var defaultMonthly = isChild ? (db.config["兒童預設每月照護"] || 30000) : (db.config["成人預設每月開支"] || 40000);
          var defaultMonths = isChild ? (db.config["兒童預設陪伴月數"] || 24) : (db.config["成人預設休養月數"] || 36);
          var defaultCiExist = isChild ? (db.config["兒童預設現有危疾"] || 0) : (db.config["成人預設現有危疾"] || 500000);
          pageHtml = `
            <section class="card ${state.currentStep === stepNum ? 'active' : ''}" id="stepCard_${stepNum}">
              <span class="tag">${page.tagName}</span>
              <h1>${page.title}</h1>
              <p class="subtitle">${page.subtitle}</p>
              
              <div class="section-block" id="blockMedical">
                <h2>🏥 醫療防線檢視</h2>
                <div class="form-group" style="background:#ffffff; padding:12px; border:1.5px solid var(--primary); border-radius:10px;">
                  <label style="color:var(--primary); font-size:13px;">預計私家醫療費用 (HK$)</label>
                  <input type="text" id="medicalCost" value="${Number(defaultMed).toLocaleString()}" class="format-currency" style="font-size:16px; font-weight:800;">
                </div>
                
                ${!isChild ? `
                <div class="defense-card" id="cardCompanyMed">
                  <h3>第一道防線：公司醫保</h3>
                  <div class="form-group">
                    <label>是否有公司醫保？</label>
                    <select id="hasCompanyMed">
                      <option value="yes">有</option>
                      <option value="no" selected>沒有</option>
                    </select>
                  </div>
                  <div id="companyMedDetails" style="display:none;">
                    <div class="input-grid">
                      <div class="form-group">
                        <label>預計索償上限 (HK$)</label>
                        <input type="text" id="companyLimit" value="100,000" class="format-currency">
                      </div>
                      <div class="form-group">

    function updatePageCounter() {

      for (var s = 0; s <= state.totalSteps; s++) {
        var card = document.getElementById('stepCard_' + s);
        var pstep = document.getElementById('pstep_' + s);
        if (card) card.classList.toggle('active', s === state.currentStep);

    function applyVisibilityStep3() {
      var medBlock = document.getElementById('blockMedical');
      var ciBlock = document.getElementById('blockCI');
      if (!medBlock || !ciBlock) return;
      var curStep2 = cleanKey(state.step2Scenario);
      if (curStep2 === 'medical') {
        medBlock.style.display = 'block';
        ciBlock.style.display = 'none';
      } else if (curStep2 === 'ci') {
        medBlock.style.display = 'none';
        ciBlock.style.display = 'block';
      } else {
        medBlock.style.display = 'block';
        ciBlock.style.display = 'block';
      }
    }
    function calculate() {
      var costElem = document.getElementById('medicalCost');
      if (!costElem) return;
      var cost = parseNum(costElem.value);
      state.medCost = cost;
      var compSelect = document.getElementById('hasCompanyMed');
      var hasComp = compSelect ? compSelect.value === 'yes' : false;
      state.hasCompanyMed = hasComp ? 'yes' : 'no';
      var compPay = 0;
      if (hasComp && state.targetRole === 'adult') {
        var compLimit = parseNum(document.getElementById('companyLimit').value);
        var compRate = parseNum(document.getElementById('companyRate').value);
        state.companyLimit = compLimit;
        state.companyRate = compRate;
        compPay = Math.min(cost, compLimit) * (compRate / 100);
      } else {
        state.companyLimit = 0;
        state.companyRate = 0;
      }
      state.companyPay = compPay;
      var remainingAfterComp = Math.max(0, cost - compPay);
      var persSelect = document.getElementById('hasPersonalMed');
      var hasPers = persSelect ? persSelect.value === 'yes' : true;
      state.hasPersonalMed = hasPers ? 'yes' : 'no';
      var persPay = 0;
      if (hasPers) {
        var pLimit = parseNum(document.getElementById('personalLimit').value);
        var pRate = parseNum(document.getElementById('personalRate').value);
        state.personalLimit = pLimit;
        state.personalRate = pRate;
        persPay = Math.min(remainingAfterComp, pLimit) * (pRate / 100);
      } else {
        state.personalLimit = 0;
        state.personalRate = 0;
      }
      state.personalPay = persPay;
      var finalGap = Math.max(0, cost - compPay - persPay);
      state.finalMedGap = finalGap;
      var cpElem = document.getElementById('companyPayDisplay');
      if (cpElem) cpElem.innerText = 'HK$ ' + Math.round(compPay).toLocaleString();
      var ppElem = document.getElementById('personalPayDisplay');
      if (ppElem) ppElem.innerText = 'HK$ ' + Math.round(persPay).toLocaleString();
      var tmgElem = document.getElementById('totalMedGapDisplay');
      if (tmgElem) tmgElem.innerText = 'HK$ ' + Math.round(finalGap).toLocaleString();
      var ciM = parseNum(document.getElementById('ciMonthly').value);
      var ciMonths = parseNum(document.getElementById('ciMonths').value);
      var ciExist = parseNum(document.getElementById('existingCI').value);
      state.ciMonthly = ciM;
      state.ciMonths = ciMonths;
      state.ciTotal = ciM * ciMonths;
      state.ciExisting = ciExist;
      state.ciNetGap = Math.max(0, state.ciTotal - ciExist);
      var ciTotElem = document.getElementById('ciTotalDisplay');
      if (ciTotElem) ciTotElem.innerText = 'HK$ ' + state.ciTotal.toLocaleString();
      var ciGapElem = document.getElementById('ciNetGapDisplay');
      if (ciGapElem) ciGapElem.innerText = 'HK$ ' + state.ciNetGap.toLocaleString();
    }

              <input type="text" style="flex:1;" placeholder="選項標題" data-admin-opt-title="${idx}" value="${o.title}">
            </div>
            <input type="text" placeholder="選項說明" data-admin-opt-desc="${idx}" value="${o.desc}">
          </div>`;
      });
      body.appendChild(secOpts);
      modal.style.display = 'flex';
    }
    function saveAdminPanel() {
      if (!confirm("確定儲存並將最新文案同步至 Google Sheet？")) return;
      var btnSave = document.getElementById('btnSaveAdmin');
      btnSave.innerText = "⏳ 正在同步至 Google Sheet...";
      btnSave.disabled = true;
      document.querySelectorAll('[data-admin-config]').forEach(inp => {
        db.config[inp.dataset.adminConfig] = inp.value;
      });
      var curVer = String(db.config["資料版本"] || "1.2.5").split('.');
      if (curVer.length === 3) {
        curVer[2] = Number(curVer[2]) + 1;
        db.config["資料版本"] = curVer.join('.');
      } else {
        db.config["資料版本"] = "1.2.6";
      }
      document.querySelectorAll('[data-admin-page-title]').forEach(inp => {
        var idx = Number(inp.dataset.adminPageTitle);
        db.pages[idx].title = inp.value;
      });
      document.querySelectorAll('[data-admin-page-sub]').forEach(inp => {
        var idx = Number(inp.dataset.adminPageSub);
        db.pages[idx].subtitle = inp.value;
      });
      document.querySelectorAll('[data-admin-opt-title]').forEach(inp => {
        var idx = Number(inp.dataset.adminOptTitle);
        db.options[idx].title = inp.value;
      });
      document.querySelectorAll('[data-admin-opt-icon]').forEach(inp => {
        var idx = Number(inp.dataset.adminOptIcon);
        db.options[idx].icon = inp.value;
      });
      document.querySelectorAll('[data-admin-opt-desc]').forEach(inp => {
        var idx = Number(inp.dataset.adminOptDesc);
        db.options[idx].desc = inp.value;
      });
      fetch(GAS_API_URL, {
        method: "POST",
        body: JSON.stringify(db)
      })
      .then(res => res.json())
      .then(res => {
        alert("✅ 成功同步至 Google Sheet！最新版本號：" + db.config["資料版本"]);
        localStorage.setItem('HEALTH_PLAN_DB_V10', JSON.stringify(db));
        document.getElementById('appVersion').innerText = 'v' + db.config["資料版本"];
        document.getElementById('adminModal').style.display = 'none';
        renderApp();
      })
      .catch(err => {
        alert("❌ 同步失敗，請檢查 GAS 部署權限：" + err);
      })
      .finally(() => {
        btnSave.innerText = "💾 儲存並同步至 Google Sheet";
        btnSave.disabled = false;
      });
    }
    // ======================== 全域事件 ========================
    document.getElementById('btnOpenAdmin').addEventListener('click', openAdminPanel);
    document.getElementById('appVersion').addEventListener('click', openAdminPanel);
    document.getElementById('btnCloseAdmin').addEventListener('click', () => document.getElementById('adminModal').style.display = 'none');
    document.getElementById('btnCancelAdmin').addEventListener('click', () => document.getElementById('adminModal').style.display = 'none');
    document.getElementById('btnSaveAdmin').addEventListener('click', saveAdminPanel);
    document.addEventListener('click', function(e) {
      var roleCard = e.target.closest('[data-role-btn]');
      if (roleCard) {
        document.querySelectorAll('[data-role-btn]').forEach(rc => rc.classList.remove('selected'));
        roleCard.classList.add('selected');
        state.targetRole = roleCard.dataset.roleBtn;
        renderApp();
        return;
      }
      var choiceBtn = e.target.closest('.choice-btn');
      if (choiceBtn && choiceBtn.dataset.stepChoice) {
        var pCard = choiceBtn.closest('.card');
        pCard.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected'));
        choiceBtn.classList.add('selected');
        var optKey = choiceBtn.dataset.optKey;
        var rawTxt = choiceBtn.dataset.titleText || choiceBtn.querySelector('.title').innerText.replace(/^[^\s]+\s*/, '').replace(/[「」]/g, '');
        var step = Number(choiceBtn.dataset.stepChoice);
        if (step === 1) {
          state.step1Focus = optKey;
          state.step1RawText = rawTxt;
        } else if (step === 2) {
          state.step2Scenario = optKey;
          state.step2RawText = rawTxt;
        }
        return;
      }
      var gridBtn = e.target.closest('.grid-btn');
      if (gridBtn) {
        gridBtn.classList.toggle('selected');
        state.losses = [];
        document.querySelectorAll('.grid-btn.selected').forEach(function(b) {
          state.losses.push(b.dataset.lossDesc || b.innerText);
        });
        return;
      }
      var navBtn = e.target.closest('[data-nav-action]');
      if (navBtn) {
        var action = navBtn.dataset.navAction;
        if (action === 'next') {
          if (state.currentStep === 1 && !state.step1Focus) {
            alert('請先點選你最希望得到甚麼'); return;
          }
          if (state.currentStep === 2 && !state.step2Scenario) {
            alert('請先點選你最想避免遇到的情況'); return;
          }
          if (state.currentStep === 4 && (!state.losses || state.losses.length === 0)) {
            alert('請至少點選一項你最不想失去／妥協的項目'); return;
          }
          if (state.currentStep < state.totalSteps) {
            state.currentStep++;
            if (state.currentStep === 3) {
              applyVisibilityStep3();
            }
            if (state.currentStep === state.totalSteps) {
              updateSummary();
            }
            updatePageCounter();
          }
        } else if (action === 'prev') {
          if (state.currentStep > 0) {
            state.currentStep--;
            if (state.currentStep === 3) {
              applyVisibilityStep3();
            }
            updatePageCounter();
          }
        }
      }
    });
    document.addEventListener('change', function(e) {
      if (!e.target) return;
      if (e.target.id === 'hasCompanyMed') {
        var details = document.getElementById('companyMedDetails');
        if (details) details.style.display = (e.target.value === 'yes') ? 'block' : 'none';
      }
      if (e.target.id === 'hasPersonalMed') {
        var pDetails = document.getElementById('personalMedDetails');
        if (pDetails) pDetails.style.display = (e.target.value === 'yes') ? 'block' : 'none';
      }
      calculate();
    });
    document.addEventListener('input', calculate);
    function syncDatabase() {
      var syncDot = document.getElementById('syncDot');
      var cached = localStorage.getItem('HEALTH_PLAN_DB_V10');
      if (cached) {
        try {
          db = JSON.parse(cached);
          document.getElementById('appVersion').innerText = 'v' + (db.version || '1.2.6');
          renderApp();
        } catch(err) { console.error(err); }
      }
      fetch(GAS_API_URL)
        .then(res => res.json())
        .then(remote => {
          if (remote && remote.status === 'success') {
            db = remote;
            localStorage.setItem('HEALTH_PLAN_DB_V10', JSON.stringify(remote));
            document.getElementById('appVersion').innerText = 'v' + (remote.version || '1.2.6');
            renderApp();
            if (syncDot) syncDot.style.background = '#22c55e';
          }
        })
        .catch(err => {
          console.warn('使用快取', err);
          if (syncDot) syncDot.style.background = '#eab308';
        });
    }
    syncDatabase();
  })();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then((reg) => {
          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                window.location.reload();
              }
            });
          });
        })
        .catch((err) => console.error('Service Worker 註冊失敗:', err));
    });
  }
</script>
</body>
</html>
