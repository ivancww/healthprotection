<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Health Protection Planner v1.3.4</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#1e3a8a">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HealthPlan">
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-light: #eff6ff;
      --accent: #d97706;
      --accent-light: #fffbeb;
      --danger: #dc2626;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --border: #cbd5e1;
      --pink-border: #f8d7da;
      --radius: 16px;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang HK", "Microsoft JhengHei", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px 16px;
    }
    .container {
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text-sub);
      padding: 0 4px;
    }
    .version-tag {
      font-size: 11px;
      background: #e2e8f0;
      color: #475569;
      padding: 2px 7px;
      border-radius: 10px;
      font-weight: 800;
      margin-left: 6px;
      cursor: pointer;
    }
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 32px 24px;
      border: 1px solid var(--border);
      box-shadow: 0 8px 30px -4px rgba(0, 0, 0, 0.06);
      animation: fadeIn 0.25s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .tag {
      display: inline-block;
      font-size: 12px;
      font-weight: 800;
      color: var(--primary);
      background: var(--primary-light);
      padding: 4px 10px;
      border-radius: 8px;
      margin-bottom: 14px;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.4;
      margin-bottom: 10px;
      color: var(--text-main);
    }
    p.subtitle {
      font-size: 14px;
      color: var(--text-sub);
      line-height: 1.6;
      margin-bottom: 22px;
    }
    .option-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .choice-btn {
      display: flex;
      flex-direction: column;
      gap: 5px;
      text-align: left;
      width: 100%;
      padding: 18px 18px;
      background: var(--card-bg);
      border: 2px dashed var(--pink-border);
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .choice-btn * { pointer-events: none; }
    .choice-btn:hover { border-color: var(--primary); background: var(--primary-light); }
    .choice-btn.selected {
      background: var(--primary-light);
      border-color: var(--primary);
      border-style: solid;
      box-shadow: 0 0 0 1.5px var(--primary);
    }
    .choice-btn .title {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-main);
    }
    .choice-btn .desc {
      font-size: 13px;
      color: var(--text-sub);
      line-height: 1.4;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 26px;
    }
    .btn {
      padding: 15px 20px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 800;
      border: none;
      cursor: pointer;
      transition: 0.15s ease;
    }
    .btn-primary {
      background: #0f172a;
      color: #ffffff;
      flex: 1;
      text-align: center;
    }
    .btn-primary:active {
      transform: scale(0.98);
      background: #1e293b;
    }
    .sync-status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      margin-right: 6px;
    }
    /* 管理員後台 Modal */
    #adminModal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.7);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .admin-card {
      background: #ffffff;
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .admin-header {
      padding: 16px 20px;
      background: #0f172a;
      color: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .admin-body {
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .admin-section-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--primary);
      border-bottom: 2px solid var(--primary-light);
      padding-bottom: 4px;
      margin-top: 8px;
    }
    .admin-item {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .admin-item label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
    }
    .admin-item input, .admin-item textarea {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1.5px solid var(--border);
      font-size: 13.5px;
      font-weight: 600;
      outline: none;
    }
    .admin-footer {
      padding: 14px 20px;
      background: #f1f5f9;
      display: flex;
      gap: 10px;
      border-top: 1px solid #e2e8f0;
    }
    .btn-secondary {
      background: #e2e8f0;
      color: #334155;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header-bar">
    <div style="display:flex; align-items:center;">
      <span class="sync-status-dot" id="syncDot" title="Google Sheet 同步中"></span>
      <span>HEALTH PROTECTION PLANNER</span>
      <span class="version-tag" id="appVersion" title="點擊開啟後台">v1.3.4</span>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <button type="button" id="btnOpenAdmin" style="background:none; border:none; font-size:16px; cursor:pointer;" title="後台管理">⚙️</button>
    </div>
  </div>
  
  <main id="mainCardArea">
    <section class="card">
      <span class="tag" id="uiTag">01 ｜ 關注／重視</span>
      <h1 id="uiTitle">如果健康突然出現變化，你最希望守住…？</h1>
      <p class="subtitle" id="uiSubtitle" style="display:none;"></p>
      
      <div class="option-list" id="optionsList">
        <!-- 選項 1：醫療 -->
        <button type="button" class="choice-btn" data-target="medical" id="optBtn_med">
          <span class="title">🏥 有需要時，仍然有醫療選擇</span>
          <span class="desc">希望可以按需要選擇合適的治療，而唔係被費用限制</span>
        </button>
        
        <!-- 選項 2：家庭/危疾 -->
        <button type="button" class="choice-btn" data-target="ci" id="optBtn_ci">
          <span class="title">🛡️ 家庭生活</span>
          <span class="desc">即使面對重大疾病，家庭生活仍然可以維持</span>
        </button>
        
        <!-- 選項 3：兩者都要 -->
        <button type="button" class="choice-btn" data-target="both" id="optBtn_both">
          <span class="title">🏥＋🛡️ 兩方面都重要</span>
          <span class="desc">既想保留醫療選擇，也想保留家庭財務安全。</span>
        </button>
      </div>

      <div class="btn-group">
        <button type="button" class="btn btn-primary" id="btnNextAction">下一步 →</button>
      </div>
    </section>
  </main>
</div>

<!-- 後台管理彈窗 (Google Sheet 雙向同步) -->
<div id="adminModal">
  <div class="admin-card">
    <div class="admin-header">
      <span style="font-weight:800; font-size:16px;">🛠️ 後台管理系統 (Google Sheet 雙向同步)</span>
      <button type="button" id="btnCloseAdmin" style="background:none; border:none; color:#fff; font-size:20px; cursor:pointer;">✕</button>
    </div>
    <div class="admin-body" id="adminBodyContent"></div>
    <div class="admin-footer">
      <button type="button" class="btn btn-secondary" id="btnCancelAdmin" style="flex:1;">取消</button>
      <button type="button" class="btn btn-primary" id="btnSaveAdmin" style="flex:2;">💾 儲存並同步至 Google Sheet</button>
    </div>
  </div>
</div>

<script>
  (function() {
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwiLwLfOhe_R0rwDpkhSPJz_qBdOchyEozTIg7biPfJxkZudjdUgPKjeQEGYSnuiTHG/exec";
    const STORAGE_KEY = 'HEALTH_PLAN_LITE_V134';

    let selectedTarget = null;

    let db = {
      version: "1.3.4",
      config: {
        "資料版本": "1.3.4",
        "醫療App網址": "https://ivancww.github.io/medicalclaims",
        "危疾App網址": "https://ivancww.github.io/CIApp",
        "標籤文字": "01 ｜ 關注／重視",
        "主標題": "如果健康突然出現變化，你最希望守住…？",
        "副標題": "",
        "選項1_標題": "🏥 有需要時，仍然有醫療選擇",
        "選項1_說明": "希望可以按需要選擇合適的治療，而唔係被費用限制",
        "選項2_標題": "🛡️ 家庭生活",
        "選項2_說明": "即使面對重大疾病，家庭生活仍然可以維持",
        "選項3_標題": "🏥＋🛡️ 兩方面都重要",
        "選項3_說明": "既想保留醫療選擇，也想保留家庭財務安全。"
      }
    };

    function applyDbToUI() {
      const cfg = db.config || {};
      if (cfg["標籤文字"]) document.getElementById('uiTag').innerText = cfg["標籤文字"];
      if (cfg["主標題"]) document.getElementById('uiTitle').innerText = cfg["主標題"];
      
      const subEl = document.getElementById('uiSubtitle');
      if (cfg["副標題"] && cfg["副標題"].trim() !== '') {
        subEl.innerText = cfg["副標題"];
        subEl.style.display = 'block';
      } else {
        subEl.style.display = 'none';
      }

      if (cfg["選項1_標題"]) document.querySelector('#optBtn_med .title').innerText = cfg["選項1_標題"];
      if (cfg["選項1_說明"]) document.querySelector('#optBtn_med .desc').innerText = cfg["選項1_說明"];

      if (cfg["選項2_標題"]) document.querySelector('#optBtn_ci .title').innerText = cfg["選項2_標題"];
      if (cfg["選項2_說明"]) document.querySelector('#optBtn_ci .desc').innerText = cfg["選項2_說明"];

      if (cfg["選項3_標題"]) document.querySelector('#optBtn_both .title').innerText = cfg["選項3_標題"];
      if (cfg["選項3_說明"]) document.querySelector('#optBtn_both .desc').innerText = cfg["選項3_說明"];

      document.getElementById('appVersion').innerText = 'v' + (cfg["資料版本"] || db.version || '1.3.4');
    }

    // 選項點擊事件
    document.querySelectorAll('.choice-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected'));
        this.classList.add('selected');
        selectedTarget = this.getAttribute('data-target');
      });
    });

    // 下一步跳轉分流
    document.getElementById('btnNextAction').addEventListener('click', function() {
      if (!selectedTarget) {
        alert('請先點選你最希望守住的項目');
        return;
      }

      const cfg = db.config || {};
      const medBase = (cfg["醫療App網址"] || "https://ivancww.github.io/medicalclaims").trim().replace(/\/+$/, '');
      const ciBase = (cfg["危疾App網址"] || "https://ivancww.github.io/CIApp").trim().replace(/\/+$/, '');

      if (selectedTarget === 'medical') {
        // 1. 醫療 App
        window.location.href = `${medBase}?focus=medical`;
      } else if (selectedTarget === 'ci') {
        // 2. 危疾 App
        window.location.href = `${ciBase}?focus=ci`;
      } else if (selectedTarget === 'both') {
        // 3. 兩者都要 ➔ 先進入醫療 App，並標記 both 狀態
        window.location.href = `${medBase}?focus=both&alertMsg=${encodeURIComponent('大病往往引發醫療開支與生活儲備兩條戰線，完成醫療評估後建議同步檢視危疾。')}`;
      }
    });

    // ================= 後台管理 =================
    function openAdminModal() {
      const modal = document.getElementById('adminModal');
      const body = document.getElementById('adminBodyContent');
      body.innerHTML = '<div class="admin-section-title">⚙️ 系統參數 & 題目設定</div>';

      for (const [k, v] of Object.entries(db.config)) {
        body.innerHTML += `
          <div class="admin-item">
            <label>${k}</label>
            <input type="text" data-admin-cfg="${k}" value="${v}">
          </div>`;
      }
      modal.style.display = 'flex';
    }

    function saveAdminModal() {
      const btn = document.getElementById('btnSaveAdmin');
      btn.innerText = "⏳ 正在同步至 Google Sheet...";
      btn.disabled = true;

      document.querySelectorAll('[data-admin-cfg]').forEach(inp => {
        db.config[inp.dataset.adminCfg] = inp.value;
      });

      fetch(GAS_API_URL, {
        method: "POST",
        body: JSON.stringify(db)
      })
      .then(res => res.json())
      .then(res => {
        alert("✅ 成功同步至 Google Sheet！");
        localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
        applyDbToUI();
        document.getElementById('adminModal').style.display = 'none';
      })
      .catch(err => {
        alert("❌ 同步失敗：" + err);
      })
      .finally(() => {
        btn.innerText = "💾 儲存並同步至 Google Sheet";
        btn.disabled = false;
      });
    }

    document.getElementById('btnOpenAdmin').addEventListener('click', openAdminModal);
    document.getElementById('appVersion').addEventListener('click', openAdminModal);
    document.getElementById('btnCloseAdmin').addEventListener('click', () => document.getElementById('adminModal').style.display = 'none');
    document.getElementById('btnCancelAdmin').addEventListener('click', () => document.getElementById('adminModal').style.display = 'none');
    document.getElementById('btnSaveAdmin').addEventListener('click', saveAdminModal);

    function syncRemote() {
      const syncDot = document.getElementById('syncDot');
      const cached = localStorage.getItem(STORAGE_KEY);
      if (cached) {
        try {
          db = JSON.parse(cached);
          applyDbToUI();
        } catch(e) {}
      }

      fetch(GAS_API_URL)
        .then(res => res.json())
        .then(remote => {
          if (remote && remote.status === 'success' && remote.config) {
            db = remote;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(remote));
            applyDbToUI();
            if (syncDot) syncDot.style.background = '#22c55e';
          }
        })
        .catch(() => {
          if (syncDot) syncDot.style.background = '#eab308';
        });
    }

    syncRemote();
  })();
</script>
</body>
</html>
