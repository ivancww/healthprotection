<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Health Protection Planner v1.3.1 | AVA 專屬</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#1e3a8a">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HealthPlan">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700;900&display=swap');
    :root {
      --primary: #1e3a8a;
      --primary-light: #eff6ff;
      --accent: #d97706;
      --accent-light: #fffbeb;
      --danger: #dc2626;
      --danger-light: #fef2f2;
      --warning-bg: #fef3c7;
      --warning-border: #fcd34d;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --border: #cbd5e1;
      --pink-border: #f8d7da;
      --radius: 16px;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans HK', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px;
    }
    .container {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text-sub);
    }
    .version-tag {
      font-size: 11px;
      background: #e2e8f0;
      color: #475569;
      padding: 2px 7px;
      border-radius: 10px;
      font-weight: 800;
      margin-left: 6px;
      cursor: pointer;
    }
    .role-badge {
      font-size: 11.5px;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 12px;
      background: #e0e7ff;
      color: #3730a3;
    }
    .progress-track {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    .progress-step {
      height: 6px;
      flex: 1;
      background: var(--border);
      border-radius: 999px;
      transition: background 0.3s ease;
    }
    .progress-step.active {
      background: var(--primary);
    }
    .card {
      display: none;
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 28px 24px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
    }
    .card.active {
      display: block;
      animation: fadeIn 0.25s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .tag {
      display: inline-block;
      font-size: 12px;
      font-weight: 800;
      color: var(--primary);
      background: var(--primary-light);
      padding: 4px 10px;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.4;
      margin-bottom: 8px;
      color: var(--text-main);
    }
    p.subtitle {
      font-size: 14px;
      color: var(--text-sub);
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .role-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 14px;
    }
    .role-card {
      border: 2px dashed var(--pink-border);
      border-radius: 14px;
      padding: 20px 14px;
      background: #ffffff;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .role-card:hover {
      border-color: var(--primary);
      background: var(--primary-light);
    }
    .role-card.selected {
      border-color: var(--primary);
      border-style: solid;
      background: var(--primary-light);
      box-shadow: 0 0 0 1.5px var(--primary);
    }
    .role-emoji { font-size: 38px; margin-bottom: 8px; }
    .role-title { font-size: 17px; font-weight: 800; color: var(--text-main); margin-bottom: 4px; }
    .role-subtitle { font-size: 13px; font-weight: 700; color: var(--primary); margin-bottom: 6px; }
    .role-desc { font-size: 11.5px; color: var(--text-sub); line-height: 1.4; }
    
    .choice-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .choice-btn {
      display: flex;
      flex-direction: column;
      gap: 4px;
      text-align: left;
      width: 100%;
      padding: 16px 18px;
      background: var(--card-bg);
      border: 2px dashed var(--pink-border);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .choice-btn * { pointer-events: none; }
    .choice-btn:hover { border-color: var(--primary); background: var(--primary-light); }
    .choice-btn.selected {
      background: var(--primary-light);
      border-color: var(--primary);
      border-style: solid;
      box-shadow: 0 0 0 1px var(--primary);
    }
    .choice-btn .title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
    }
    .choice-btn .desc {
      font-size: 13px;
      color: var(--text-sub);
      line-height: 1.4;
    }

    /* 03 頁專用防線檢視卡片 */
    .section-block {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      margin-top: 16px;
    }
    .section-block h2 {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 14px;
    }
    .defense-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-top: 12px;
    }
    .defense-card h3 {
      font-size: 14px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 10px;
    }
    .input-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 8px;
    }
    label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
    }
    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 2px dashed var(--pink-border);
      background: #ffffff;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      outline: none;
    }
    
    /* 03 頁藍色防線現狀框 */
    .blue-summary-box {
      background: #f0f7ff;
      border: 1.5px solid #bfdbfe;
      border-radius: 12px;
      padding: 16px;
      margin-top: 16px;
    }
    .blue-summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #1e3a8a;
    }
    .blue-summary-row.total-line {
      border-top: 1.5px dashed #93c5fd;
      padding-top: 10px;
      margin-top: 10px;
      font-size: 16px;
      font-weight: 900;
    }
    .blue-summary-val {
      font-size: 18px;
      font-weight: 900;
      color: #1e3a8a;
    }

    .grid-2x2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 12px;
    }
    .grid-btn {
      padding: 18px;
      text-align: center;
      border-radius: 12px;
      border: 2px dashed var(--pink-border);
      background: var(--card-bg);
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      line-height: 1.5;
      transition: all 0.2s ease;
    }
    .grid-btn * { pointer-events: none; }
    .grid-btn.selected {
      background: var(--primary-light);
      border-color: var(--primary);
      border-style: solid;
      box-shadow: 0 0 0 1px var(--primary);
    }
    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }
    .btn {
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }
    .btn-primary {
      background: #0f172a;
      color: #ffffff;
      flex: 1;
    }
    .btn-secondary {
      background: #f1f5f9;
      border: 1px solid var(--border);
      color: var(--text-main);
    }

    /* 05 頁全新二部分深度 Review 樣式 */
    .review-part-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 14px;
    }
    .review-part-tag {
      font-size: 11px;
      font-weight: 800;
      color: #64748b;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      display: block;
    }
    .review-part-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .review-part-desc {
      font-size: 13.5px;
      color: #475569;
      line-height: 1.6;
      border-left: 3px solid #cbd5e1;
      padding-left: 10px;
      margin-top: 6px;
    }

    /* 第二部分：核心 Review (放大核心金句) */
    .part3-hero-box {
      background: #f0f7ff;
      border: 1.5px solid #bfdbfe;
      border-left: 5px solid var(--primary);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 18px;
    }
    .part3-hero-text {
      font-size: 15.5px;
      font-weight: 800;
      color: #1e3a8a;
      line-height: 1.7;
    }

    /* 05 頁雙入口卡片設計 (還原 App Logo) */
    .dual-entry-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 10px;
    }
    .entry-nav-card {
      background: #ffffff;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .entry-nav-card:hover {
      border-color: var(--primary);
      background: var(--primary-light);
    }
    .entry-nav-card:active {
      transform: scale(0.99);
    }
    .entry-nav-card.highlight-primary {
      border: 2px solid var(--primary);
      background: #f0f7ff;
      box-shadow: 0 4px 14px rgba(30, 58, 138, 0.08);
    }
    .entry-app-logo {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      object-fit: cover;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .entry-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .entry-header {
      font-size: 15.5px;
      font-weight: 800;
      color: var(--text-main);
    }
    .entry-desc {
      font-size: 12.5px;
      color: var(--text-sub);
      line-height: 1.5;
    }
    .entry-action-btn {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 2px;
    }

    .sync-status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      margin-right: 6px;
    }

    /* 1:1 粉紅虛線後台鏡像系統 */
    #adminModal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.75);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }
    .admin-card {
      background: #eef2f5;
      width: 100%;
      max-width: 880px;
      max-height: 94vh;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .admin-header {
      padding: 14px 20px;
      background: #1e3a8a;
      color: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .admin-nav-tabs {
      display: flex;
      gap: 6px;
      padding: 10px 16px;
      background: #e2e8f0;
      overflow-x: auto;
      flex-shrink: 0;
    }
    .admin-nav-btn {
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 8px;
      border: none;
      background: #fff;
      cursor: pointer;
      color: #475569;
      white-space: nowrap;
    }
    .admin-nav-btn.active {
      background: #1e3a8a;
      color: #fff;
    }
    .admin-body {
      padding: 18px;
      overflow-y: auto;
      flex: 1;
    }
    .editable-mirror {
      border: 2px dashed #f472b6 !important;
      background: #fff0f5 !important;
      border-radius: 8px;
      padding: 4px 8px;
      outline: none;
      transition: 0.2s;
    }
    .editable-mirror:focus {
      border-color: #db2777 !important;
      background: #ffffff !important;
      box-shadow: 0 0 0 2px rgba(219, 39, 119, 0.2);
    }
    @media (max-width: 520px) {
      .input-grid, .grid-2x2, .role-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header-bar">
    <div style="display:flex; align-items:center;">
      <span class="sync-status-dot" id="syncDot" title="Google Sheet 同步中"></span>
      <span>HEALTH PROTECTION PLANNER</span>
      <span class="version-tag" id="appVersion" onclick="openAdminPanel()" title="點擊開啟後台鏡像系統">v1.3.1</span>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <span class="role-badge" id="topRoleBadge">👨‍👩‍👧 成人模式</span>
      <button type="button" onclick="openAdminPanel()" style="background:none; border:none; font-size:16px; cursor:pointer;" title="後台管理">⚙️</button>
      <span id="pageCounter">00 / 05</span>
    </div>
  </div>
  
  <div class="progress-track" id="mainProgressTrack"></div>
  <main id="dynamicAppContainer"></main>
</div>

<!-- ==================== 1:1 粉紅虛線鏡像後台管理系統 ==================== -->
<div id="adminModal">
  <div class="admin-card">
    <div class="admin-header">
      <span style="font-weight:800; font-size:15px;">🛠️ AVA 視覺化後台鏡像系統 (粉紅虛線可點擊修改)</span>
      <button type="button" onclick="closeAdminPanel()" style="background:none; border:none; color:#fff; font-size:20px; cursor:pointer;">✕</button>
    </div>
    <div class="admin-nav-tabs">
      <button class="admin-nav-btn active" onclick="switchAdminTab('pPages')">頁面題目與選項管理</button>
      <button class="admin-nav-btn" onclick="switchAdminTab('pReview')">總結文案庫 (05 Review)</button>
      <button class="admin-nav-btn" onclick="switchAdminTab('pRules')">規則設定庫 (Alert)</button>
      <button class="admin-nav-btn" onclick="switchAdminTab('pConfig')">系統設定 & 參數範本</button>
    </div>
    <div class="admin-body">
      <!-- 1. 頁面流程與選項鏡像 -->
      <div id="admTab-pPages" class="adm-section-panel">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
          <strong style="color:var(--primary); font-size:14px;">📄 頁面題目與選項管理（對應「頁面設定」與「選項設定」）</strong>
          <button type="button" onclick="addAdminNewPage()" style="background:var(--primary); color:#fff; border:none; border-radius:6px; padding:6px 12px; font-size:12px; cursor:pointer;">+ 新增頁面</button>
        </div>
        <div id="adminPagesMirror"></div>
      </div>
      
      <!-- 2. 05 總結文案庫鏡像 (精確對應最新 Google Sheet 結構) -->
      <div id="admTab-pReview" class="adm-section-panel" style="display:none;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
          <strong style="color:var(--primary); font-size:14px;">📝 總結文案庫（對應 Google Sheet「總結文案庫」工作表）</strong>
          <button type="button" onclick="addAdminReviewTpl()" style="background:var(--primary); color:#fff; border:none; border-radius:6px; padding:6px 12px; font-size:12px; cursor:pointer;">+ 新增文案</button>
        </div>
        <div id="adminReviewMirror"></div>
      </div>

      <!-- 3. 規則設定庫鏡像 -->
      <div id="admTab-pRules" class="adm-section-panel" style="display:none;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
          <strong style="color:var(--primary); font-size:14px;">⚙️ 雙戰線匹配提醒規則（對應「規則設定」工作表）</strong>
          <button type="button" onclick="addAdminRule()" style="background:var(--primary); color:#fff; border:none; border-radius:6px; padding:6px 12px; font-size:12px; cursor:pointer;">+ 新增規則</button>
        </div>
        <div id="adminRulesMirror"></div>
      </div>

      <!-- 4. 系統設定 -->
      <div id="admTab-pConfig" class="adm-section-panel" style="display:none;">
        <div class="card" style="display:block; margin:0;" id="adminConfigList"></div>
      </div>
    </div>
    <div style="padding:14px 20px; background:#f1f5f9; display:flex; gap:10px; border-top:1px solid #e2e8f0;">
      <button type="button" class="btn btn-secondary" onclick="closeAdminPanel()" style="flex:1;">取消</button>
      <button type="button" class="btn btn-primary" id="btnSaveAdmin" onclick="saveAdminPanel()" style="flex:2;">💾 儲存並同步至 Google Sheet</button>
    </div>
  </div>
</div>

<script>
  (function() {
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwiLwLfOhe_R0rwDpkhSPJz_qBdOchyEozTIg7biPfJxkZudjdUgPKjeQEGYSnuiTHG/exec";
    
    var state = {

        "兒童預設現有危疾": 0
      },
      pages: [
        { pageId: "p1_adult", role: "adult", stepOrder: 1, tagName: "01 ｜ 關注/重視", title: "如果健康突然出現變化，你最希望守住…？", subtitle: "", pageType: "單選題" },
        { pageId: "p2_adult", role: "adult", stepOrder: 2, tagName: "02 ｜ 想像一下", title: "如果有一天需要接受治療，你希望自己點樣作選擇？", subtitle: "", pageType: "單選題" },
        { pageId: "p3_adult", role: "adult", stepOrder: 3, tagName: "03 ｜ 防線檢視", title: "如果真係有須要，你已有的保障，可以幫你走幾遠？", subtitle: "", pageType: "試算頁" },

      return Number(String(val || '').replace(/,/g, '')) || 0;

    function cleanKey(val) {
      if (!val) return '';
      val = String(val).toLowerCase().trim();
      if (val.startsWith('med')) return 'med';
      if (val.startsWith('ci')) return 'ci';
      if (val.startsWith('both')) return 'both';
      if (val.startsWith('any')) return 'any';
      return val;
    }

    function initFormatCurrency() {
      document.querySelectorAll('.format-currency').forEach(function(input) {
        input.addEventListener('input', function() {
          var rawVal = this.value.replace(/,/g, '').replace(/[^\d]/g, '');
          if (rawVal === '') { this.value = ''; return; }
          this.value = Number(rawVal).toLocaleString();
        });
        input.addEventListener('blur', function() {
          if (this.value === '') this.value = '0';
        });
      });
    }

    function updatePageCounter() {
      var badge = document.getElementById('topRoleBadge');
      if (badge) badge.innerText = state.targetRole === 'child' ? '👶 兒童模式' : '👨‍👩‍👧 成人模式';
      var counter = document.getElementById('pageCounter');
      if (counter) counter.innerText = '0' + state.currentStep + ' / 0' + state.totalSteps;
      for (var s = 0; s <= state.totalSteps; s++) {
        var card = document.getElementById('stepCard_' + s);
        var pstep = document.getElementById('pstep_' + s);
        if (card) card.classList.toggle('active', s === state.currentStep);
        if (pstep) pstep.classList.toggle('active', s <= state.currentStep);
      }
      window.scrollTo(0, 0);
    }

    function calculate() {
      var costElem = document.getElementById('medicalCost');
      if (!costElem) return;
      var cost = parseNum(costElem.value);
      state.medCost = cost;
      
      var compSelect = document.getElementById('hasCompanyMed');
      var hasComp = compSelect ? compSelect.value === 'yes' : false;
      state.hasCompanyMed = hasComp ? 'yes' : 'no';
      var compPay = 0;
      if (hasComp && state.targetRole === 'adult') {
        var compLimit = parseNum(document.getElementById('companyLimit').value);
        var compRate = parseNum(document.getElementById('companyRate').value);
        state.companyLimit = compLimit;
        state.companyRate = compRate;
        compPay = Math.min(cost, compLimit) * (compRate / 100);
      } else {
        state.companyLimit = 0;
        state.companyRate = 0;
      }
      state.companyPay = compPay;
      
      var remainingAfterComp = Math.max(0, cost - compPay);
      var persSelect = document.getElementById('hasPersonalMed');
      var hasPers = persSelect ? persSelect.value === 'yes' : false;
      state.hasPersonalMed = hasPers ? 'yes' : 'no';
      var persPay = 0;
      if (hasPers) {
        var pLimit = parseNum(document.getElementById('personalLimit').value);
        var pRate = parseNum(document.getElementById('personalRate').value);
        state.personalLimit = pLimit;
        state.personalRate = pRate;
        persPay = Math.min(remainingAfterComp, pLimit) * (pRate / 100);
      } else {
        state.personalLimit = 0;
        state.personalRate = 0;
      }
      state.personalPay = persPay;
      state.totalExistingPay = compPay + persPay;

      // 更新 03 頁藍色摘要數字
      var dispCost = document.getElementById('dispBlueCost');
      var dispExist = document.getElementById('dispBlueExisting');
      if (dispCost) dispCost.innerText = 'HK$ ' + cost.toLocaleString();
      if (dispExist) dispExist.innerText = 'HK$ ' + Math.round(state.totalExistingPay).toLocaleString();
    }

    // ======================== 05 頁全新二部分動態渲染 ========================
    function updateSummaryReview() {
      var curStep1 = cleanKey(state.step1Focus) || 'med';
      var r = state.targetRole;
      
      // 1. 從「總結文案庫」匹配對應模組
      var reviewList = (db && db.reviews && db.reviews.length > 0) ? db.reviews : DEFAULT_FALLBACK_DB.reviews;
      var matchedReview = reviewList.find(rv => rv.role === r && cleanKey(rv.mode) === curStep1);
      if (!matchedReview) {
        matchedReview = reviewList.find(rv => rv.role === r) || DEFAULT_FALLBACK_DB.reviews[0];
      }

      // 第一部分：客人答案
      var elP1Title = document.getElementById('p5-part1-title');
      var elP1Desc = document.getElementById('p5-part1-desc');
      if (elP1Title) elP1Title.innerText = state.step1RawText || matchedReview.part1Title;
      if (elP1Desc) elP1Desc.innerText = matchedReview.part1Desc;

      // 第二部分：核心 Review (一句金句放大)
      var elP3Quote = document.getElementById('p5-part3-quote');
      if (elP3Quote) elP3Quote.innerText = `「${matchedReview.part3Review}」`;

      // 動態組裝 URL
      function compileUrl(baseUrl, paramTemplate, valMap) {
        var cleanBase = (baseUrl || '').trim().replace(/\/+$/, '');
        var queryString = paramTemplate || '';
        for (var k in valMap) {
          var val = valMap[k];
          queryString = queryString.replace(new RegExp('\\{' + k + '\\}', 'g'), encodeURIComponent(val !== undefined && val !== null ? val : ''));
        }
        return cleanBase + (queryString ? '?' + queryString : '');
      }

      var lossText = (state.losses && state.losses.length > 0) ? state.losses.join('、') : (r === 'child' ? '全天候陪伴,教育規劃' : '退休計劃,家庭資產');
      var valDict = {
        role: state.targetRole,
        type: state.targetRole,
        cost: state.medCost,
        medCost: state.medCost,
        hasCompany: state.hasCompanyMed,
        companyLimit: state.companyLimit,
        companyRate: state.companyRate,
        hasPersonal: state.hasPersonalMed,
        personalLimit: state.personalLimit,
        personalRate: state.personalRate,
        expense: state.ciMonthly,
        ciMonthly: state.ciMonthly,
        months: state.ciMonths,
        ciMonths: state.ciMonths,
        existing: state.ciExisting,
        existingCI: state.ciExisting,
        losses: lossText,
        alertMsg: state.alertMsg || '',
        focus: state.step1Focus || ''
      };

      var medBase = (db.config && db.config["醫療App網址"]) || "https://ivancww.github.io/medicalclaims";
      var medTpl = (db.config && db.config["醫療App參數"]) || "role={role}&cost={medCost}&hasCompany={hasCompany}&companyLimit={companyLimit}&companyRate={companyRate}&hasPersonal={hasPersonal}&personalLimit={personalLimit}&personalRate={personalRate}&losses={losses}&alertMsg={alertMsg}&focus={focus}";
      var ciBase = (db.config && db.config["危疾App網址"]) || "https://ivancww.github.io/CIApp";
      var ciTpl = (db.config && db.config["危疾App參數"]) || "role={role}&expense={ciMonthly}&months={ciMonths}&existing={existingCI}&losses={losses}&alertMsg={alertMsg}&focus={focus}";

      var medUrl = compileUrl(medBase, medTpl, valDict);
      var ciUrl = compileUrl(ciBase, ciTpl, valDict);

      // 動態組裝 App 卡片 HTML
      var isMedFirst = (curStep1 === 'med');
      var isCiFirst = (curStep1 === 'ci');

      var medCardHtml = `
        <a href="${medUrl}" target="_blank" rel="noopener noreferrer" class="entry-nav-card ${isMedFirst ? 'highlight-primary' : ''}">
          <img src="https://ivancww.github.io/medicalclaims/icon-192.png" alt="Medical App Logo" class="entry-app-logo" onerror="this.src='https://ivancww.github.io/medicalclaims/icon-192.png';">
          <div class="entry-content">
            <div class="entry-header">🏥 ${isMedFirst ? '你最關注：醫療選擇' : '溫馨提示：醫療選擇防線'}</div>
            <div class="entry-desc">${matchedReview.medIntro}</div>
            <div class="entry-action-btn">了解醫療方案 →</div>
          </div>
        </a>`;

      var ciCardHtml = `
        <a href="${ciUrl}" target="_blank" rel="noopener noreferrer" class="entry-nav-card ${isCiFirst ? 'highlight-primary' : ''}" style="border-color:#fed7aa; background:${isCiFirst ? '#fff7ed' : '#fffaf5'};">
          <img src="https://ivancww.github.io/CIApp/icon-192.png" alt="CI App Logo" class="entry-app-logo" onerror="this.src='https://ivancww.github.io/CIApp/icon-192.png';">
          <div class="entry-content">
            <div class="entry-header" style="color:#c2410c;">🛡️ ${isCiFirst ? '你最關注：生活與收入防線' : '另外，你剛才亦提到……'}</div>
            <div class="entry-desc">${matchedReview.ciIntro}</div>
            <div class="entry-action-btn" style="color:#ea580c;">了解生活保障 (治療之外，生活呢？) →</div>
          </div>
        </a>`;

      var entryBox = document.getElementById('p5-dual-entry-box');
      if (entryBox) {
        if (isCiFirst) {
          entryBox.innerHTML = ciCardHtml + medCardHtml;
        } else {
          entryBox.innerHTML = medCardHtml + ciCardHtml;
        }
      }
    }

          db.reviews[idx].medIntro = document.querySelector(`[data-adm-rv-medintro="${idx}"]`).innerText.trim();
          db.reviews[idx].ciIntro = document.querySelector(`[data-adm-rv-ciintro="${idx}"]`).innerText.trim();
        }
      });

      // 收集規則
      document.querySelectorAll('[data-adm-rule-alert]').forEach((el, idx) => {
        if (db.rules[idx]) db.rules[idx].alertMsg = el.innerText.trim();
      });

      // 收集系統設定
      document.querySelectorAll('[data-adm-config]').forEach(inp => {
        db.config[inp.dataset.admConfig] = inp.value;
      });

      fetch(GAS_API_URL, {
        method: "POST",
        body: JSON.stringify(db)
      })
      .then(res => res.json())
      .then(res => {
        alert("✅ Google Sheet 雙向同步成功！版本號：" + (db.config["資料版本"] || "1.3.1"));
        localStorage.setItem('HEALTH_PLAN_DB_V10', JSON.stringify(db));
        document.getElementById('appVersion').innerText = 'v' + (db.config["資料版本"] || "1.3.1");
        closeAdminPanel();
        renderApp();
      })
      .catch(err => {
        alert("❌ 同步失敗，請檢查 GAS 部署：" + err);
      })
      .finally(() => {
        btnSave.innerText = "💾 儲存並同步至 Google Sheet";
        btnSave.disabled = false;
      });
    };

    // ======================== 全域事件綁定 ========================
    document.addEventListener('click', function(e) {
      var roleCard = e.target.closest('[data-role-btn]');
      if (roleCard) {
        document.querySelectorAll('[data-role-btn]').forEach(rc => rc.classList.remove('selected'));
        roleCard.classList.add('selected');
        state.targetRole = roleCard.dataset.roleBtn;
        renderApp();
        return;
      }
      
      var choiceBtn = e.target.closest('.choice-btn');
      if (choiceBtn && choiceBtn.dataset.stepChoice) {
        var pCard = choiceBtn.closest('.card');
        pCard.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected'));
        choiceBtn.classList.add('selected');
        var optKey = choiceBtn.dataset.optKey;
        var rawTxt = choiceBtn.dataset.titleText || choiceBtn.querySelector('.title').innerText.replace(/^[^\s]+\s*/, '').replace(/[「」]/g, '');
        var step = Number(choiceBtn.dataset.stepChoice);
        if (step === 1) {
          state.step1Focus = optKey;
          state.step1RawText = rawTxt;
        } else if (step === 2) {
          state.step2Scenario = optKey;
          state.step2RawText = rawTxt;
        }
        return;
      }
      
      var gridBtn = e.target.closest('.grid-btn');
      if (gridBtn) {
        gridBtn.classList.toggle('selected');
        state.losses = [];
        document.querySelectorAll('.grid-btn.selected').forEach(function(b) {
          state.losses.push(b.dataset.lossDesc || b.innerText);
        });
        return;
      }
      
      var navBtn = e.target.closest('[data-nav-action]');
      if (navBtn) {
        var action = navBtn.dataset.navAction;
        if (action === 'next') {
          if (state.currentStep === 1 && !state.step1Focus) {
            alert('請先點選你最希望得到甚麼'); return;
          }
          if (state.currentStep === 2 && !state.step2Scenario) {
            alert('請先點選你最想避免遇到的情況'); return;
          }
          if (state.currentStep === 4 && (!state.losses || state.losses.length === 0)) {
            alert('請至少點選一項你最不想失去／妥協的項目'); return;
          }
          if (state.currentStep < state.totalSteps) {
            state.currentStep++;
            if (state.currentStep === state.totalSteps) {
              updateSummaryReview();
            }
            updatePageCounter();
          }
        } else if (action === 'prev') {
          if (state.currentStep > 0) {
            state.currentStep--;
            updatePageCounter();
          }
        }
      }
    });

    document.addEventListener('change', function(e) {
      if (!e.target) return;
      if (e.target.id === 'hasCompanyMed') {
        var details = document.getElementById('companyMedDetails');
        if (details) details.style.display = (e.target.value === 'yes') ? 'block' : 'none';
      }
      if (e.target.id === 'hasPersonalMed') {
        var pDetails = document.getElementById('personalMedDetails');
        if (pDetails) pDetails.style.display = (e.target.value === 'yes') ? 'block' : 'none';
      }
      calculate();
    });

    document.addEventListener('input', calculate);

    function syncDatabase() {
      var syncDot = document.getElementById('syncDot');
      var cached = localStorage.getItem('HEALTH_PLAN_DB_V10');
      if (cached) {
        try {
          db = JSON.parse(cached);
          document.getElementById('appVersion').innerText = 'v' + (db.version || '1.3.1');
          renderApp();
        } catch(err) { console.error(err); }
      }
      fetch(GAS_API_URL)
        .then(res => res.json())
        .then(remote => {
          if (remote && remote.status === 'success') {
            db = remote;
            localStorage.setItem('HEALTH_PLAN_DB_V10', JSON.stringify(remote));
            document.getElementById('appVersion').innerText = 'v' + (remote.version || '1.3.1');
            renderApp();
            if (syncDot) syncDot.style.background = '#22c55e';
          }
        })
        .catch(err => {
          console.warn('使用快取', err);
          if (syncDot) syncDot.style.background = '#eab308';
        });
    }

    syncDatabase();
  })();
</script>
</body>
</html>
